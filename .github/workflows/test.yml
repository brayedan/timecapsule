name: test

on:
  push:
  pull_request:

jobs:
  test:
    # Pinned to the current LTS: actions/python-versions ships 3.9 (and
    # 3.10) toolcache builds only up to 24.04 — ubuntu-latest is 26.04
    # and has no 3.9 build at all. A pinned runner keeps the EOL-version
    # legs real and deterministic.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
